<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propelr: Finding Tickets in Stratus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Inter',sans-serif;color:#444;padding:.5rem;position:relative}

:root{
  --blue:#5D70AE; --green:#59A398; --navy:#1B2F5B;
  --border:#d8dce8; --gradbottom:#e8edf8;
}

.eyebrow{text-transform:uppercase;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--green);margin-bottom:10px}
.body-text{font-size:18px;color:#444;line-height:1.6;margin-bottom:14px}
.body-text b{color:var(--navy)}

.status-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--blue);color:#fff;
  font-size:14px;font-weight:700;padding:12px 20px;border-radius:8px;
  border:none;cursor:pointer;font-family:'Inter',sans-serif;
}
.status-btn:hover{background:var(--green)}
.status-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}

.modal-overlay{
  display:none;position:absolute;top:0;left:0;right:0;height:100vh;background:rgba(27,47,91,.55);
  align-items:center;justify-content:center;z-index:1000;padding:20px;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:#fff;border-radius:10px;max-width:960px;width:100%;
  max-height:90vh;overflow-y:auto;padding:24px;position:relative;
}
.modal-close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  background:var(--gradbottom);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--navy);font-weight:700;
}
.modal-box img{width:100%;border-radius:8px;border:1px solid var(--border);display:block}
</style>
</head>
<body>

<div class="eyebrow">Checking on Your Deal</div>
<p class="body-text">To find updates in Stratus, open the lead or merchant account and scroll down the center of the page until you see <b>Support Notes, Online Agreement Forms, and Tickets</b>. This is where our support team communicates with you and shares updates on the status of your deal.</p>
